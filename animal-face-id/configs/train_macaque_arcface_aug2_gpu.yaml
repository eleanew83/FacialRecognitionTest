name: macaque-resnet50-arcface_aug2_gpu  # aug2 recipe re-run on GPU (control for hardware/eval-code changes)
# Identical recipe to train_macaque_arcface_aug2.yaml (basic aug + plain CE), but a
# distinct `name` so it does NOT overwrite the original CPU-trained aug2 checkpoint.
# Purpose: does GPU/AMP + the train.py val fix change the aug2 result (0.831)?

data:
  dataset_name: macaque_faces
  raw_root: /rds/user/ylj20/hpc-work/FacialRecognitionTest/yolo_detection/yolo_detection_code/output/macaque_crops
  splits_path: /rds/user/ylj20/hpc-work/FacialRecognitionTest/animal-face-id/data/macaque_faces/splits.json
  batch_size: 32
  num_workers: 8
  image_size: 224
  num_classes: 156
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augment: basic

model:
  backbone: resnet50
  embedding_dim: 256
  head: arcface
  margin: 0.5
  scale: 30.0
  pretrained: true

trainer:
  max_epochs: 30
  lr: 0.0003
  weight_decay: 0.01
  scheduler: cosine
  device: cuda
  amp: true
  grad_clip: 1.0
  loss: cross_entropy
  checkpoint_dir: artifacts
  seed: 42

inference:
  checkpoint: artifacts/macaque-resnet50-arcface_aug2_gpu_best.pt
  gallery_path: artifacts/macaque_gallery_index_aug2_gpu.pkl
  knn:
    metric: cosine
    top_k: 5

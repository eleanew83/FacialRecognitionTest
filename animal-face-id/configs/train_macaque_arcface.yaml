name: macaque-resnet18-arcface

data:
  dataset_name: macaque_faces
  raw_root: /home/ylj20/FacialRecognitionTest/yolo_detection/yolo_detection_code/output/macaque_crops
  splits_path: /home/ylj20/FacialRecognitionTest/animal-face-id/data/macaque_faces/splits.json
  # Local paths
  # raw_root: /Users/eleanew83/Documents/OneDrive - University of Cambridge/Cambridge/macaque_flattened
  # splits_path: /Users/eleanew83/Library/CloudStorage/OneDrive-UniversityofCambridge/Cambridge/FacialRecognitionTest/animal-face-id/data/macaque_faces/splits.json
  batch_size: 32
  num_workers: 0
  image_size: 224
  num_classes: 156
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  backbone: resnet18 # Use resnet50 for full run
  embedding_dim: 256
  head: arcface
  margin: 0.5
  scale: 30.0
  pretrained: true

trainer:
  max_epochs: 1 # default: 10, use 1 for testing
  lr: 0.0003
  weight_decay: 0.01
  scheduler: cosine
  device: mps
  amp: false
  grad_clip: 1.0
  loss: cross_entropy
  checkpoint_dir: artifacts
  seed: 42

inference:
  checkpoint: artifacts/macaque-resnet18-arcface_best.pt
  gallery_path: artifacts/gallery_index.pkl
  knn:
    metric: cosine
    top_k: 5

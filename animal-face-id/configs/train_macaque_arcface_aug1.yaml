name: macaque-resnet50-arcface_aug1 # change if want to save a different version

data:
  dataset_name: macaque_faces
  raw_root: /rds/user/ylj20/hpc-work/FacialRecognitionTest/yolo_detection/yolo_detection_code/output/macaque_crops
  splits_path: /rds/user/ylj20/hpc-work/FacialRecognitionTest/animal-face-id/data/macaque_faces/splits.json
  # Local paths (other machines)
  # raw_root: /Users/eleanew83/Documents/OneDrive - University of Cambridge/Cambridge/macaque_flattened
  # splits_path: /Users/eleanew83/Library/CloudStorage/OneDrive-UniversityofCambridge/Cambridge/FacialRecognitionTest/animal-face-id/data/macaque_faces/splits.json
  batch_size: 32
  num_workers: 0
  image_size: 224
  num_classes: 156
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  backbone: resnet50 # Use resnet50 for full run; resnet18 for testing
  embedding_dim: 256
  head: arcface
  margin: 0.5
  scale: 30.0
  pretrained: true

trainer:
  max_epochs: 30 # Change for testing: 1 or full run: 30
  lr: 0.0003
  weight_decay: 0.01
  scheduler: cosine
  device: cpu # Use cuda for GPU run; mps for Mac
  amp: false
  grad_clip: 1.0
  loss: cross_entropy
  checkpoint_dir: artifacts
  seed: 42

inference:
  checkpoint: artifacts/macaque-resnet50-arcface_aug1_best.pt # change if want to save a different version
  gallery_path: artifacts/macaque_gallery_index_aug1.pkl # change if want to save a different version
  knn:
    metric: cosine
    top_k: 5
